server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Matches spring.servlet.multipart.max-file-size in application.yml -
    # nginx's 1MB default otherwise rejects any real video upload with a 413
    # before it ever reaches the backend.
    client_max_body_size 500M;

    location / {
        try_files $uri /index.html;
    }

    # In production this proxies to the backend service name from
    # docker-compose; on AWS, point this at the backend's actual URL/ALB
    # instead (see README's deployment notes).
    location /api/ {
        proxy_pass http://backend:8080/api/;
    }
}
