version: "3.8"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: bedererai
      POSTGRES_USER: bedererai
      POSTGRES_PASSWORD: bedererai
    ports:
      - "5432:5432"
    volumes:
      - bedererai-db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/bedererai
      DATABASE_USERNAME: bedererai
      DATABASE_PASSWORD: bedererai
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DEMO_USERNAME: ${DEMO_USERNAME:-demo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?set a real demo password}
      MAX_ANALYSES_PER_DAY: ${MAX_ANALYSES_PER_DAY:-20}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  bedererai-db-data:
